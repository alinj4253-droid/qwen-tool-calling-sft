# Smoke SFT: Qwen3-4B-Base, LoRA, 500 samples, ~60 steps, dual 4090.
run_name: qwen3-4b-smoke
model_path: Qwen/Qwen3-4B-Base
data_dir: data/smoke
load_in_4bit: false
bf16: true
max_seq_length: 2048
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
max_steps: 60
num_train_epochs: 1
learning_rate: 1.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.0
gradient_checkpointing: true
packing: false  # SDPA without flash-attn: packing risks cross-sample attention
logging_steps: 2
save_steps: 100
save_total_limit: 1
do_eval: false
seed: 42
dataloader_num_workers: 2
optim: adamw_torch
