# Strong balanced targeted stage: same balanced mix as train_targeted_bal
# but main-SFT learning rate and 3 epochs. Rationale: p05/p10 (lr 2e-5,
# 1 epoch, 248 steps) did not override the single-call stopping habit
# (0/100 multi-block on the extended benchmark); the base model already
# emits multi-calls non-canonically (~40%), so a stronger data/SFT arm is
# the prescribed fix before any RL.
run_name: qwen3-4b-targeted-bal-strong
model_path: Qwen/Qwen3-4B-Base
base_adapter_path: runs/qwen3-4b-sft-v2-30k-r32/final_adapter
data_dir: data/targeted_bal
load_in_4bit: false
bf16: true
max_seq_length: 2048
loss_mode: assistant_only
special_token_training: none
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
max_steps: -1
num_train_epochs: 3
learning_rate: 1.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.0
gradient_checkpointing: true
packing: false
logging_steps: 10
save_steps: 400
save_total_limit: 1
do_eval: false
seed: 42
dataloader_num_workers: 2
optim: adamw_8bit
