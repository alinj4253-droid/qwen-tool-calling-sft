# SFT-v2 30k: controlled comparison vs v1 (qwen3-4b-sft-30k-r32).
# Only TWO knobs change relative to v1, everything else is held constant:
#   1) loss_mode: full -> assistant_only
#   2) special tokens: modules_to_save (full embed/head) -> selective 6 rows
run_name: qwen3-4b-sft-v2-30k-r32
model_path: Qwen/Qwen3-4B-Base
data_dir: data/full_v2
max_train_samples: 30000
load_in_4bit: false
bf16: true
max_seq_length: 2048
loss_mode: assistant_only
special_token_training: selective
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
max_steps: -1
num_train_epochs: 1
learning_rate: 1.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.0
gradient_checkpointing: true
packing: false
max_eval_samples: 500
logging_steps: 20
save_steps: 400
save_total_limit: 2
do_eval: true
eval_strategy: steps
eval_steps: 400
seed: 42
dataloader_num_workers: 2
optim: adamw_8bit
