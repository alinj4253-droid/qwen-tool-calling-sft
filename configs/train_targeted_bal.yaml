# Balanced targeted stage: 10% parallel + 10% trap-like + 10% pure chat,
# continuing from the v2-30k adapter. Addresses both residual failures:
# multi-call emission and over-eager calling (wrong-tool traps / abstention).
run_name: qwen3-4b-targeted-bal
model_path: Qwen/Qwen3-4B-Base
base_adapter_path: runs/qwen3-4b-sft-v2-30k-r32/final_adapter
data_dir: data/targeted_bal
load_in_4bit: false
bf16: true
max_seq_length: 2048
loss_mode: assistant_only
special_token_training: none
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
max_steps: -1
num_train_epochs: 1
learning_rate: 2.0e-5
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.0
gradient_checkpointing: true
packing: false
logging_steps: 10
save_steps: 200
save_total_limit: 1
do_eval: false
seed: 42
dataloader_num_workers: 2
optim: adamw_8bit
